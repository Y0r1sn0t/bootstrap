<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

</head>
<body>
    <header>
        <nav class="container">
            <ul class="nav justify-content-center gap-4 text-bg-primary">
            <li class="nav-item">Home</li>
            <li class="nav-item">Tips</li>
            <li class="nav-item">About</li>
            <li class="nav-item">Help</li>
            </ul>
        </nav>
    </header>

    <section class="container" id="slide-container">
    <section class="carousel slide" id="slider" data-bs-ride="carousel">
        <section class="carousel-indicators">

        <button
            type="button"
            class="active"
            data-bs-target="#slider"
            data-bs-slide-to="0"
            aria-currrent="true"
            aria-label="Soul Eater">
        </button>

         <button
            type="button"
            data-bs-target="#slider"
            data-bs-slide-to="1"
            aria-label="JoJo's Bizarre Adventures">
        </button>

        <button
            type="button"
            data-bs-target="#slider"
            data-bs-slide-to="2"
            aria-label="Hunter X Hunter">
        </button>

        <section class="carousel-inner">
            <section class="carousel-item active">
                <img src="images/soul_eater.jpeg" alt="" class="d-block w-100"
                <section class="carousel-caption">
                    <h5>Soul Eater</h5>
                    <a href="#" class="btn btn-dark">nada demais</a>
            </section>
        </section>

        <section class="carousel-item active">
                <img src="images/jojo.jpeg" alt="" class="d-block w-100"
                <section class="carousel-caption">
                    <h5>JoJo's Bizarre Adventures</h5>
                    <a href="#" class="btn btn-dark">nada demais</a>
            </section>
        </section>

    <section class="d-grid gap-2 col-4 mx-auto">
  <button class="btn btn-primary" type="button">Tap</button>
  <button class="btn btn-primary" type="button">Don't tap</button>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
